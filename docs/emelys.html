<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farewell Message Board</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Analytics (GTAG) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-32LFMP5EXN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-32LFMP5EXN');
    </script>
    <style>
        @media print {
            .print-hidden { display: none !important; }
            .break-inside-avoid { break-inside: avoid; }
        }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-blue-100">
    <div id="root"></div>

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- Your Production Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmeyOU8RW8rhPmGYCXAail2OlPPE_Nkmg",
            authDomain: "emelys-leaving.firebaseapp.com",
            projectId: "emelys-leaving",
            storageBucket: "emelys-leaving.firebasestorage.app",
            messagingSenderId: "1023387550130",
            appId: "1:1023387550130:web:10b4bbb6dc9502b30ce4ab",
            measurementId: "G-32LFMP5EXN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appIdForPath = 'farewell-messages';

        // Make Firebase available to the React component
        window.FirebaseApp = { 
            auth, 
            db, 
            appId: appIdForPath, 
            signInAnonymously, 
            onAuthStateChanged, 
            collection, 
            doc,
            addDoc, 
            deleteDoc,
            onSnapshot, 
            getDoc,
            serverTimestamp 
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /**
         * Utility to compress images to ensure they stay under Firestore's 1MB limit.
         */
        const compressImage = (base64Str, maxWidth = 800, maxHeight = 800, quality = 0.7) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxWidth) {
                            height *= maxWidth / width;
                            width = maxWidth;
                        }
                    } else {
                        if (height > maxHeight) {
                            width *= maxHeight / height;
                            height = maxHeight;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
            });
        };

        // Lucide Icon Component Wrapper
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = ''; 
                    const iconName = name === 'ImageIcon' ? 'image' : name.toLowerCase();
                    const element = document.createElement('i');
                    element.setAttribute('data-lucide', iconName);
                    if (className) element.setAttribute('class', className);
                    ref.current.appendChild(element);
                    lucide.createIcons({
                        attrs: { 
                            strokeWidth: 2, 
                            width: size, 
                            height: size
                        }
                    });
                }
            }, [name, size, className]);
            return <span ref={ref} className={`inline-flex items-center justify-center ${className}`} />;
        };

        const App = () => {
            const [fbReady, setFbReady] = useState(false);
            const [authError, setAuthError] = useState(null);
            const [user, setUser] = useState(null);
            const [messages, setMessages] = useState([]);
            const [view, setView] = useState('submit');
            const [formData, setFormData] = useState({ 
                name: '', content: '', isAnonymous: false, profilePic: '', attachment: '' 
            });
            const [status, setStatus] = useState({ type: '', message: '' });
            const [isCompressing, setIsCompressing] = useState(false);
            const [adminKey, setAdminKey] = useState('');
            const [correctAdminKey, setCorrectAdminKey] = useState('admin123');
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [messageToDelete, setMessageToDelete] = useState(null);
            
            const profileInputRef = useRef(null);
            const attachmentInputRef = useRef(null);

            useEffect(() => {
                const checkFirebase = setInterval(() => {
                    if (window.FirebaseApp) {
                        setFbReady(true);
                        clearInterval(checkFirebase);
                    }
                }, 100);
                return () => clearInterval(checkFirebase);
            }, []);

            useEffect(() => {
                if (!fbReady) return;
                const { auth, signInAnonymously, onAuthStateChanged } = window.FirebaseApp;
                
                signInAnonymously(auth).catch(err => {
                    console.error("Auth failed:", err);
                    if (err.code === 'auth/configuration-not-found') {
                        setAuthError("Anonymous sign-in is not enabled in your Firebase Console.");
                    } else {
                        setAuthError(err.message);
                    }
                });

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, [fbReady]);

            // Real-time listener for messages and config
            useEffect(() => {
                if (!user || !fbReady) return;
                const { db, appId, collection, onSnapshot, doc } = window.FirebaseApp;
                
                // Fetch Messages
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'farewellMessages');
                const unsubscribeMessages = onSnapshot(messagesRef, (snapshot) => {
                    const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                        .sort((a, b) => {
                            const timeA = a.timestamp?.seconds || 0;
                            const timeB = b.timestamp?.seconds || 0;
                            return timeB - timeA;
                        });
                    setMessages(msgs);
                }, (err) => {
                    console.error("Firestore error:", err);
                    setStatus({ type: 'error', message: "Database access denied. Check rules." });
                });

                // Fetch Admin Key from Firebase using the 'config' document ID
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'adminSettings', 'config');
                const unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
                    if (docSnap.exists() && docSnap.data().key) {
                        setCorrectAdminKey(docSnap.data().key);
                    }
                });

                return () => {
                    unsubscribeMessages();
                    unsubscribeConfig();
                };
            }, [user, fbReady]);

            const handleFileChange = async (e, field) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsCompressing(true);
                const reader = new FileReader();
                reader.onloadend = async () => {
                    try {
                        const compressed = await compressImage(reader.result, 800, 800, 0.7);
                        setFormData(prev => ({ ...prev, [field]: compressed }));
                    } catch (err) {
                        console.error("Compression error:", err);
                        alert("Could not process image.");
                    } finally {
                        setIsCompressing(false);
                    }
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.content.trim() || !fbReady || !user || isCompressing) return;
                const { db, appId, collection, addDoc, serverTimestamp } = window.FirebaseApp;
                
                try {
                    const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'farewellMessages');
                    await addDoc(messagesRef, {
                        ...formData,
                        name: formData.isAnonymous ? 'Anonymous' : (formData.name || 'Anonymous'),
                        profilePic: formData.isAnonymous ? '' : formData.profilePic,
                        timestamp: serverTimestamp(),
                        userId: user.uid
                    });
                    setFormData({ name: '', content: '', isAnonymous: false, profilePic: '', attachment: '' });
                    setStatus({ type: 'success', message: 'Your message has been sent! ❤️' });
                    if (window.gtag) window.gtag('event', 'submit_message', { 'is_anonymous': formData.isAnonymous });
                    setTimeout(() => setStatus({ type: '', message: '' }), 4000);
                } catch (error) {
                    console.error("Submit error:", error);
                    setStatus({ type: 'error', message: 'Failed to send message.' });
                }
            };

            const handleDelete = async () => {
                if (!messageToDelete || !fbReady) return;
                const { db, appId, doc, deleteDoc } = window.FirebaseApp;
                
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'farewellMessages', messageToDelete);
                    await deleteDoc(docRef);
                    setMessageToDelete(null);
                    setStatus({ type: 'success', message: 'Message removed successfully.' });
                    setTimeout(() => setStatus({ type: '', message: '' }), 3000);
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete message. Check your permissions.");
                }
            };

            const handlePrint = () => {
                if (window.gtag) window.gtag('event', 'print_messages');
                window.print();
            };

            const handleAdminLogin = () => {
                if(adminKey === correctAdminKey) { 
                    setView('admin'); 
                    setShowAdminLogin(false); 
                    setAdminKey(''); 
                } else {
                    alert('Incorrect access key');
                }
            };

            if (authError) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 text-center">
                        <div className="bg-red-50 border border-red-200 rounded-2xl p-8 max-w-md shadow-lg">
                            <Icon name="ShieldAlert" size={32} className="text-red-600 mb-4 mx-auto" />
                            <h2 className="text-xl font-black text-red-900 mb-2">Setup Required</h2>
                            <p className="text-red-700 font-medium">{authError}</p>
                        </div>
                    </div>
                );
            }

            if (!fbReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-600"></div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen selection:bg-blue-200">
                    <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10 print-hidden">
                        <div className="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-black text-blue-600 text-xl tracking-tight">
                                <Icon name="Heart" size={26} className="text-blue-600 fill-blue-50" />
                                <span>Farewell Board</span>
                            </div>
                            <button 
                                onClick={() => view === 'admin' ? setView('submit') : setShowAdminLogin(true)} 
                                className="bg-slate-50 hover:bg-slate-100 text-slate-600 px-4 py-2 rounded-xl border border-slate-200 flex items-center gap-2 text-sm font-bold transition-all active:scale-95"
                            >
                                <Icon name={view === 'admin' ? 'MessageSquare' : 'ShieldCheck'} size={18} />
                                {view === 'admin' ? 'Leave Message' : 'Organizer View'}
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-6 md:py-12">
                        {status.message && (
                            <div className={`max-w-xl mx-auto mb-6 p-5 rounded-2xl text-sm font-black animate-in zoom-in duration-300 flex items-center gap-3 print-hidden ${status.type === 'success' ? 'bg-green-50 text-green-700 border border-green-100' : 'bg-red-50 text-red-700 border border-red-100'}`}>
                                <Icon name={status.type === 'success' ? 'CheckCircle' : 'AlertCircle'} size={20} />
                                {status.message}
                            </div>
                        )}

                        {view === 'submit' ? (
                            <div className="max-w-xl mx-auto animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="text-center mb-10">
                                    <h1 className="text-3xl md:text-5xl font-black text-slate-900 mb-4 tracking-tight leading-tight">Wish them well! 🚀</h1>
                                    <p className="text-slate-500 text-lg font-bold">Post a message, memory, or photo for the team.</p>
                                </div>
                                
                                <form onSubmit={handleSubmit} className="bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/60 p-8 md:p-10 border border-slate-100 space-y-8">
                                    {!formData.isAnonymous && (
                                        <div className="flex items-center gap-5 group">
                                            <div 
                                                onClick={() => !isCompressing && profileInputRef.current.click()} 
                                                className="w-20 h-20 rounded-3xl bg-slate-50 border-2 border-dashed border-slate-200 flex items-center justify-center cursor-pointer overflow-hidden relative transition-all hover:border-blue-400 hover:bg-blue-50/50"
                                            >
                                                {formData.profilePic ? (
                                                    <img src={formData.profilePic} className="w-full h-full object-cover" />
                                                ) : isCompressing ? (
                                                    <div className="animate-spin h-6 w-6 border-2 border-blue-600 border-t-transparent rounded-full" />
                                                ) : (
                                                    <Icon name="Camera" size={24} className="text-slate-400 group-hover:text-blue-500" />
                                                )}
                                            </div>
                                            <input type="file" ref={profileInputRef} className="hidden" accept="image/*" onChange={(e) => handleFileChange(e, 'profilePic')} />
                                            <div>
                                                <p className="text-base font-black text-slate-900">Your Photo</p>
                                                <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">Optional</p>
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-3">
                                        <label className="text-sm font-black text-slate-500 uppercase tracking-widest ml-1">Your Display Name</label>
                                        <input 
                                            type="text" 
                                            disabled={formData.isAnonymous} 
                                            placeholder={formData.isAnonymous ? "Anonymous User" : "e.g. Sarah Smith"} 
                                            className="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent outline-none focus:border-blue-500/30 focus:bg-white disabled:opacity-50 transition-all font-bold text-slate-900" 
                                            value={formData.name} 
                                            onChange={(e) => setFormData({...formData, name: e.target.value})} 
                                        />
                                    </div>

                                    <div className="space-y-3">
                                        <label className="text-sm font-black text-slate-500 uppercase tracking-widest ml-1">Your Message</label>
                                        <textarea 
                                            required 
                                            rows={5} 
                                            placeholder="Write your well wishes here..." 
                                            className="w-full px-6 py-4 rounded-2xl bg-slate-50 border-2 border-transparent outline-none focus:border-blue-500/30 focus:bg-white resize-none transition-all font-bold text-slate-900 leading-relaxed" 
                                            value={formData.content} 
                                            onChange={(e) => setFormData({...formData, content: e.target.value})} 
                                        />
                                    </div>

                                    <div className="space-y-3">
                                        <label className="text-sm font-black text-slate-500 uppercase tracking-widest ml-1">Attachment</label>
                                        <div 
                                            onClick={() => !isCompressing && attachmentInputRef.current.click()} 
                                            className="w-full h-48 rounded-[2rem] border-2 border-dashed border-slate-200 bg-slate-50/50 flex flex-col items-center justify-center cursor-pointer hover:bg-blue-50/30 hover:border-blue-400 transition-all overflow-hidden relative"
                                        >
                                            {formData.attachment ? (
                                                <img src={formData.attachment} className="h-full w-full object-cover" />
                                            ) : (
                                                <div className="flex flex-col items-center">
                                                    <Icon name="Image" size={32} className="text-slate-300 mb-2" />
                                                    <span className="text-xs text-slate-400 font-black uppercase tracking-widest">Click to upload</span>
                                                </div>
                                            )}
                                        </div>
                                        <input type="file" ref={attachmentInputRef} className="hidden" accept="image/*" onChange={(e) => handleFileChange(e, 'attachment')} />
                                    </div>

                                    <div 
                                        className="flex items-center gap-4 bg-slate-50 p-5 rounded-2xl cursor-pointer border-2 border-transparent transition-all hover:bg-white hover:border-slate-100 group" 
                                        onClick={() => setFormData({...formData, isAnonymous: !formData.isAnonymous})}
                                    >
                                        <div className={`w-12 h-7 rounded-full relative transition-all duration-300 ${formData.isAnonymous ? 'bg-blue-600' : 'bg-slate-300'}`}>
                                            <div className={`absolute top-1 w-5 h-5 bg-white rounded-full transition-all duration-300 shadow-md ${formData.isAnonymous ? 'left-8' : 'left-1'}`} />
                                        </div>
                                        <span className="text-sm font-black text-slate-800 flex items-center gap-2">
                                            <Icon name="Ghost" size={18}/> Anonymous Posting
                                        </span>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={!formData.content.trim() || isCompressing}
                                        className="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 active:scale-[0.98] flex items-center justify-center gap-3 shadow-2xl shadow-blue-600/30 transition-all disabled:opacity-50"
                                    >
                                        <span>Send Message</span>
                                        <Icon name="Send" size={22} />
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div className="space-y-8 animate-in fade-in duration-700">
                                <div className="flex flex-col md:flex-row justify-between items-center md:items-end gap-6 print-hidden bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                                    <div>
                                        <h1 className="text-3xl font-black text-slate-900 tracking-tight leading-none mb-2">Collected Messages</h1>
                                        <p className="text-slate-400 font-bold uppercase tracking-widest text-xs">{messages.length} notes received</p>
                                    </div>
                                    <button 
                                        onClick={handlePrint} 
                                        className="bg-blue-600 text-white px-8 py-4 rounded-2xl font-black flex items-center gap-3 hover:bg-blue-700 shadow-xl shadow-blue-500/20 active:scale-95 transition-all"
                                    >
                                        <Icon name="Printer" size={20}/> 
                                        <span>Print Final Board</span>
                                    </button>
                                </div>
                                
                                <div className="grid gap-8 print:grid-cols-1">
                                    {messages.map(msg => (
                                        <div key={msg.id} className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100 break-inside-avoid relative overflow-hidden group">
                                            {/* Deletion Button (Admin only) */}
                                            <div className="absolute top-8 right-8 print-hidden">
                                                <button 
                                                    onClick={() => setMessageToDelete(msg.id)}
                                                    className="w-10 h-10 rounded-xl bg-red-50 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition-all opacity-0 group-hover:opacity-100"
                                                    title="Remove message"
                                                >
                                                    <Icon name="Trash2" size={18} />
                                                </button>
                                            </div>

                                            <div className="flex items-center gap-5 mb-8">
                                                {msg.profilePic ? (
                                                    <img src={msg.profilePic} className="w-16 h-16 rounded-[1.25rem] object-cover ring-8 ring-blue-50" />
                                                ) : (
                                                    <div className={`w-14 h-14 rounded-[1.25rem] flex items-center justify-center ${msg.isAnonymous ? 'bg-slate-50' : 'bg-blue-50'}`}>
                                                        <Icon name={msg.isAnonymous ? 'Ghost' : 'User'} size={28} className={msg.isAnonymous ? 'text-slate-300' : 'text-blue-500'} />
                                                    </div>
                                                )}
                                                <div>
                                                    <span className={`font-black text-xl block leading-tight ${msg.isAnonymous ? 'text-slate-400 italic' : 'text-slate-900'}`}>
                                                        {msg.name}
                                                    </span>
                                                    <span className="text-[11px] text-slate-400 uppercase tracking-widest font-black flex items-center gap-1.5 mt-1">
                                                        <Icon name="Calendar" size={13} className="text-slate-300" />
                                                        {msg.timestamp?.toDate ? msg.timestamp.toDate().toLocaleDateString() : 'Recently'}
                                                    </span>
                                                </div>
                                            </div>
                                            <p className="text-slate-700 text-xl whitespace-pre-wrap leading-relaxed font-bold">{msg.content}</p>
                                            {msg.attachment && (
                                                <div className="mt-8 rounded-[2rem] overflow-hidden border border-slate-50 shadow-2xl shadow-slate-200/50">
                                                    <img src={msg.attachment} className="w-full max-h-[600px] object-contain bg-slate-50/50" />
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Delete Confirmation Modal */}
                    {messageToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[60] flex items-center justify-center p-6 animate-in fade-in duration-300">
                            <div className="bg-white rounded-[2.5rem] p-10 max-w-sm w-full shadow-2xl animate-in zoom-in duration-300">
                                <div className="w-16 h-16 bg-red-50 rounded-2xl flex items-center justify-center mb-6 mx-auto">
                                    <Icon name="AlertTriangle" size={32} className="text-red-500" />
                                </div>
                                <h2 className="text-2xl font-black text-center mb-2">Delete Message?</h2>
                                <p className="text-slate-500 text-sm text-center mb-8 font-bold">This action cannot be undone. Are you sure?</p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={handleDelete}
                                        className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black hover:bg-red-700 transition-all"
                                    >
                                        Delete
                                    </button>
                                    <button 
                                        onClick={() => setMessageToDelete(null)}
                                        className="flex-1 bg-slate-100 text-slate-600 py-4 rounded-2xl font-black hover:bg-slate-200 transition-all"
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xl z-50 flex items-center justify-center p-6 transition-all animate-in fade-in duration-300">
                            <div className="bg-white rounded-[3rem] p-10 md:p-12 max-w-sm w-full shadow-2xl animate-in zoom-in duration-300">
                                <div className="w-20 h-20 bg-blue-50 rounded-3xl flex items-center justify-center mb-8 mx-auto shadow-inner">
                                    <Icon name="ShieldCheck" size={36} className="text-blue-600" />
                                </div>
                                <h2 className="text-3xl font-black text-center text-slate-900 mb-3">Organizer</h2>
                                <input 
                                    type="password" 
                                    autoFocus 
                                    placeholder="Access key..." 
                                    className="w-full px-6 py-5 rounded-2xl bg-slate-50 border-2 border-transparent mb-8 outline-none focus:border-blue-600 focus:bg-white transition-all font-black text-center tracking-[0.3em] text-xl" 
                                    value={adminKey} 
                                    onChange={e => setAdminKey(e.target.value)} 
                                    onKeyDown={e => {
                                        if(e.key === 'Enter') {
                                            handleAdminLogin();
                                        }
                                    }} 
                                />
                                <button 
                                    onClick={handleAdminLogin} 
                                    className="w-full bg-slate-900 text-white py-5 rounded-2xl font-black hover:bg-black transition-all"
                                >
                                    Unlock
                                </button>
                                <button onClick={() => setShowAdminLogin(false)} className="w-full text-slate-400 font-bold mt-4 py-2">Cancel</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
